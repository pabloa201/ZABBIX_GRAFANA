zabbix_export:
  version: '7.2'
  host_groups:
    - uuid: 748ad4d098d447d492bb935c907f652f
      name: Databases
  hosts:
    - host: BASE_HML
      name: BASE_HML
      groups:
        - name: Databases
      interfaces:
        - ip: 10.0.1.1
          interface_ref: if1
      items:
        - name: 'Status de Conectividade Oracle'
          type: ODBC
          key: 'db.odbc.select[oracle_up,{$ORACLE.DSN}]'
          params: 'SELECT 1 FROM DUAL'
          triggers:
            - expression: 'nodata(/BASE_HML/db.odbc.select[oracle_up,{$ORACLE.DSN}],2m)=1'
              name: 'APOTST ESTÁ DOWN'
              priority: DISASTER
      macros:
        - macro: '{$ORACLE.DSN}'
          value: APOHML
        - macro: '{$ORACLE.PORT}'
          value: '1521'
        - macro: '{$ORACLE.SERVICE}'
          value: APOHML
    - host: BASE_PPRD
      name: BASE_PPRD
      groups:
        - name: Databases
      interfaces:
        - ip: 10.0.1.1
          interface_ref: if1
      items:
        - name: 'Status de Conectividade Oracle'
          type: ODBC
          key: 'db.odbc.select[oracle_up,{$ORACLE.DSN}]'
          params: 'SELECT 1 FROM DUAL'
          triggers:
            - expression: 'nodata(/BASE_PPRD/db.odbc.select[oracle_up,{$ORACLE.DSN}],2m)=1'
              name: 'APOPPRD ESTÁ DOWN'
              priority: DISASTER
      macros:
        - macro: '{$ORACLE.DSN}'
          value: APOPPRD
        - macro: '{$ORACLE.PORT}'
          value: '1521'
        - macro: '{$ORACLE.SERVICE}'
          value: APOPPRD
    - host: BASE_PRD
      name: BASE_PRD
      groups:
        - name: Databases
      interfaces:
        - ip: 10.0.1.1
          interface_ref: if1
      items:
        - name: 'Status de Conectividade Oracle'
          type: ODBC
          key: 'db.odbc.select[oracle_up,{$ORACLE.DSN}]'
          delay: 30s
          params: 'SELECT 1 FROM DUAL'
          triggers:
            - expression: 'nodata(/BASE_PRD/db.odbc.select[oracle_up,{$ORACLE.DSN}],2m)=1'
              name: 'APOLLO ESTÁ DOWN'
              priority: DISASTER
      macros:
        - macro: '{$ORACLE.DSN}'
          value: APOLLO
        - macro: '{$ORACLE.PORT}'
          value: '1521'
        - macro: '{$ORACLE.SERVICE}'
          value: APOLLO
    - host: BASE_TESTE
      name: BASE_TESTE
      groups:
        - name: Databases
      interfaces:
        - ip: 10.0.1.1
          interface_ref: if1
      items:
        - name: 'Status de Conectividade Oracle'
          type: ODBC
          key: 'db.odbc.select[oracle_up,{$ORACLE.DSN}]'
          params: 'SELECT 1 FROM DUAL'
          triggers:
            - expression: 'nodata(/BASE_TESTE/db.odbc.select[oracle_up,{$ORACLE.DSN}],2m)=1'
              name: 'APOTST ESTÁ DOWN'
              priority: DISASTER
      macros:
        - macro: '{$ORACLE.DSN}'
          value: APOTST
        - macro: '{$ORACLE.PASSWORD}'
          value: PASSWORD_DB_ORACLE
        - macro: '{$ORACLE.PORT}'
          value: '1521'
        - macro: '{$ORACLE.SERVICE}'
          value: APOTST
        - macro: '{$ORACLE.USER}'
          value: USUARIO_DB_ORACLE
