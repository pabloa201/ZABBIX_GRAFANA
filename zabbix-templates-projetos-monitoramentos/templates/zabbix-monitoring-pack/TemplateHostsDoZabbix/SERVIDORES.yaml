          interface_ref: if1
        - name: Traffic_in
          key: 'net.if.in[Broadcom NetXtreme Gigabit Ethernet]'
          delay: 30s
          history: 90d
          units: bps
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '8'
            - type: CHANGE_PER_SECOND
          interface_ref: if1
        - name: Traffic_out
          key: 'net.if.out[Broadcom NetXtreme Gigabit Ethernet]'
