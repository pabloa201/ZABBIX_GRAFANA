              name: '70% Ou + Do Disco Ocupado'
              priority: WARNING
            - expression: 'last(/LINCKFS2_10.0.1.9_D/vfs.fs.size[D:,pused]) >= 85 and last(/LINCKFS2_10.0.1.9_D/vfs.fs.size[D:,pused]) <= 89'
              name: '85% Ou + Do Disco Ocupado'
              priority: AVERAGE
            - expression: 'last(/LINCKFS2_10.0.1.9_D/vfs.fs.size[D:,pused])>=90'
              name: '90% Ou + Do Disco Ocupado'
              priority: HIGH
        - name: DISCO_TOTAL
          key: 'vfs.fs.size[D:,total]'
          delay: 5m
          history: 90d
          units: B
          interface_ref: if1
        - name: DISCO_EM_USO
          key: 'vfs.fs.size[D:,used]'
          delay: 5m
          history: 90d
          units: B
          interface_ref: if1
        - name: PercentualUsoRam
          key: 'vm.memory.size[pused]'
          history: 90d
          units: '%'
          preprocessing:
            - type: REGEX
              parameters:
                - '^([0-9]+)\.([0-9]+$)'
                - \1
          interface_ref: if1
    - host: LINCKFS2_10.0.1.9_E
      name: LINCKFS2_10.0.1.9_E
      groups:
        - name: SERVIDORES
      interfaces:
        - ip: 10.0.1.9
