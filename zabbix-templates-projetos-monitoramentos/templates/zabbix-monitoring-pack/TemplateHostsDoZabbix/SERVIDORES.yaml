          type: CALCULATED
          key: vm.memory.util
          delay: 5m
          history: 90d
          units: B
          params: 'last(/LINCKNFE_10.0.0.211/vm.memory.size[total]) - last(/LINCKNFE_10.0.0.211/vm.memory.size[used])'
