        - name: Traffic_total
          key: 'net.if.total[Broadcom NetXtreme Gigabit Ethernet]'
          delay: 30s
          history: 90d
          units: bps
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '8'
            - type: CHANGE_PER_SECOND
          interface_ref: if1
        - name: ESPAÇO_DISCO_DISPONIVEL
          type: CALCULATED
          key: vfs.fs.size
          delay: 5m
          history: 90d
          units: B
          params: 'last(/LINCKFS2_10.0.1.9_D/vfs.fs.size[D:,total]) - last(/LINCKFS2_10.0.1.9_D/vfs.fs.size[D:,used])'
        - name: '%_EM_USO'
          key: 'vfs.fs.size[D:,pused]'
